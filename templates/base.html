<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy — your week, programmed{% endblock %}</title>
  <meta name="description" content="FitBuddy turns your goal, age and intensity into a written 7-day training week.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="wordmark" href="/">FIT<span>BUDDY</span></a>
    <nav class="topnav" aria-label="Main">
      <a href="/">New plan</a>
      <a href="/admin/users">Admin</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p><span class="mono">FITBUDDY / 7-DAY PROGRAM ENGINE</span></p>
    <p class="muted">Plans are generated by Google Gemini and stored in SQLite. Train within your means; consult a professional before starting a new program.</p>
  </footer>

  <script src="/static/js/main.js" defer></script>
</body>
</html>
